<html lang="id">
<head>

    <style>
        * {

            margin: 0;
            padding: 0;

        }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);

            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 650px;
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header i {
            font-size: 45px;
            color: #38bdf8;
            margin-bottom: 12px;
        }
        .school-title {
            font-size: 26px;
            font-weight: 700;

        }

            font-weight: 600;

        }
        .header p {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 6px;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }
        input[type="text"] {

            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }
        input[type="text"]:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }
        button {
            padding: 14px 24px;
            border-radius: 12px;
            border: none;
            background: #38bdf8;
            color: #0f172a;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        button:hover {
            background: #7dd3fc;
            transform: translateY(-1px);
        }
        .error-msg {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid #ef4444;
            color: #fca5a5;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            display: none;
            margin-bottom: 20px;
            text-align: center;
        }
        .result-card {
            display: none;
            animation: fadeIn 0.4s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .student-info {
            background: rgba(15, 23, 42, 0.6);
            padding: 20px;
            border-radius: 14px;
            margin-bottom: 20px;
            border-left: 4px solid #38bdf8;
        }
        .student-info div {
            margin-bottom: 6px;
            font-size: 14px;
        }
        .student-info div:last-child {
            margin-bottom: 0;
        }
        .student-info strong {
            color: #cbd5e1;
        }
        .scores-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .score-item {
            background: rgba(15, 23, 42, 0.6);
            padding: 14px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .score-item span {
            font-size: 13px;
            color: #94a3b8;
        }
        .score-item strong {
            font-size: 16px;
            color: #38bdf8;
        }
        .rank-card {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            padding: 16px;
            border-radius: 14px;
            text-align: center;
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
        }
        @media (max-width: 480px) {
            .scores-grid {
                grid-template-columns: 1fr;
            }
            .search-box {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

</div>

    function cariNilai() {
        // Membersihkan input dari spasi yang tidak disengaja
        const inputRaw = document.getElementById('nisnInput').value;
        const nisnVal = inputRaw.replace(/\s+/g, ''); 
        const errorMsg = document.getElementById('errorMsg');
        const resultCard = document.getElementById('resultCard');

        if (!nisnVal) {
            errorMsg.innerText = "Harap masukkan NISN terlebih dahulu!";
            errorMsg.style.display = 'block';
            resultCard.style.display = 'none';
            return;
        }

        // Pencarian Cerdas (Mendukung Teks maupun Angka)
        const siswa = dataSiswa.find(s => String(s.NISN).trim() === nisnVal);

        if (siswa) {
            errorMsg.style.display = 'none';
            
            document.getElementById('resNama').innerText = siswa['NAMA SISWA'];
            document.getElementById('resNisn').innerText = siswa['NISN'];
            document.getElementById('resIndo').innerText = siswa['BAHASA INDONESIA'];
            document.getElementById('resMtk').innerText = siswa['MATEMATIKA'];
            document.getElementById('resIpas').innerText = siswa['IPAS'];
            document.getElementById('resPpkn').innerText = siswa['PPKN'];
            document.getElementById('resJawa').innerText = siswa['B. JAWA'];
            document.getElementById('resInggris').innerText = siswa['B. INGGRIS'];
            document.getElementById('resPeringkat').innerText = siswa['PERINGKAT'];

            resultCard.style.display = 'block';
        } else {
            errorMsg.innerText = "NISN '" + inputRaw + "' tidak ditemukan. Periksa kembali nomor yang Anda masukkan!";
            errorMsg.style.display = 'block';
            resultCard.style.display = 'none';
        }
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') {
            cariNilai();
        }
    }
