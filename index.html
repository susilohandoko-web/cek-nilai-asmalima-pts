            margin: 0;
            padding: 0;

        body {

            padding: 20px;
            position: relative;
        }
        .container {
            width: 100%;
            max-width: 680px;
            background: #ffffff;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(14, 165, 233, 0.12), 0 4px 12px rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(224, 242, 254, 0.8);
            position: relative;
        }
        .admin-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #f0f9ff;
            border: 1px solid #bae6fd;
            color: #0284c7;
            padding: 9px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;

            display: flex;
            align-items: center;
            gap: 6px;
        }
        .admin-btn:hover {
            background: #0284c7;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
        }
        .header {
            text-align: center;
            margin-bottom: 32px;
        }
        .logo-container {
            height: 95px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
        }
        .logo-img {
            max-height: 90px;
            max-width: 180px;
            object-fit: contain;
            border-radius: 8px;
        }
        .header-icon {
            font-size: 56px;
            color: #0284c7;
        }
        .school-title {
            font-size: 26px;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }
        .portal-title {
            font-size: 17px;
            font-weight: 600;
            color: #0284c7;
        }
        .header p {
            font-size: 13.5px;
            color: #64748b;
            margin-top: 6px;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }
        input[type="text"], input[type="password"] {
            flex: 1;
            padding: 14px 18px;
            border-radius: 14px;
            border: 1.5px solid #cbd5e1;
            background: #f8fafc;
            color: #0f172a;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }
        input[type="text"]:focus, input[type="password"]:focus {
            border-color: #0284c7;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.15);
        }
        .btn-primary {
            padding: 14px 26px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: #ffffff;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 14px rgba(2, 132, 199, 0.3);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.4);
        }
        .error-msg {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            display: none;
            margin-bottom: 22px;
            text-align: center;
        }
        .result-card {
            display: none;
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .student-info {
            background: #f0f9ff;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 22px;
            border: 1px solid #bae6fd;
            border-left: 5px solid #0284c7;
        }
        .student-info div {
            margin-bottom: 6px;
            font-size: 14.5px;
            color: #334155;
        }
        .student-info div:last-child { margin-bottom: 0; }
        .student-info strong { color: #0284c7; }
        .scores-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 22px;
        }
        .score-item {
            background: #f8fafc;
            padding: 14px 18px;
            border-radius: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #e2e8f0;
        }
        .score-item span {
            font-size: 13.5px;
            color: #475569;
            font-weight: 600;
        }
        .score-item strong {
            font-size: 17px;
            color: #0284c7;
            font-weight: 700;
        }
        .rank-card {

            border-radius: 16px;
            text-align: center;
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            box-shadow: 0 10px 25px rgba(14, 165, 233, 0.25);

            justify-content: center;
            align-items: center;

    </div>

<!-- Modal Authentication / Login Password Guru -->
<div class="modal" id="authModal">

        <div class="modal-header">
            <h3 id="authTitle"><i class="fa-solid fa-shield-halved" style="color:#0284c7;"></i> Akses Panel Guru</h3>
            <button class="close-btn" onclick="closeAuthModal()">&times;</button>
        </div>
        <p id="authDesc" style="font-size: 13.5px; color: #64748b; margin-bottom: 16px;"></p>
        
        <div class="form-group" id="groupNewPass" style="display: none;">
            <label>Buat Password Baru</label>
            <input type="password" id="inputNewPass" placeholder="Masukkan password baru">
        </div>
        <div class="form-group" id="groupConfirmPass" style="display: none;">
            <label>Konfirmasi Password Baru</label>
            <input type="password" id="inputConfirmPass" placeholder="Ulangi password baru">
        </div>
        <div class="form-group" id="groupLoginPass" style="display: none;">
            <label>Masukkan Password Guru</label>
            <input type="password" id="inputLoginPass" placeholder="Password Anda" onkeypress="handleAuthKeyPress(event)">
        </div>

        <div id="authError" style="color: #dc2626; font-size: 13px; margin-bottom: 12px; display: none;"></div>

        <button class="btn-primary" style="width: 100%; justify-content: center;" onclick="submitAuth()">
            <i class="fa-solid fa-arrow-right-to-bracket"></i> Masuk Panel
        </button>
    </div>
</div>

<!-- Modal Settings Panel Guru -->
<div class="modal" id="adminModal">

        <div class="modal-header">

</div>

    // Normalisasi NISN (Format Standar 10 Digit + Zero Padding)
    function formatNISN(rawNisn) {
        if (!rawNisn) return "";
        let clean = String(rawNisn).trim().replace(/\s+/g, '');
        if (clean.length > 0 && clean.length < 10) {
            clean = clean.padStart(10, '0');
        }
        return clean;
    }

            renderLogo(savedLogo);
        }

        if (savedExcelData) {
            try {
                dataSiswaActive = JSON.parse(savedExcelData);
            } catch(e) {
                dataSiswaActive = defaultSiswa;
            }
        } else {
            dataSiswaActive = defaultSiswa;
        }
    };

    function renderLogo(base64Image) {
        const logoEl = document.getElementById('schoolLogo');
        const iconEl = document.getElementById('defaultIcon');
        logoEl.src = base64Image;
        logoEl.style.display = 'block';
        iconEl.style.display = 'none';
    }

    // Pencarian Nilai Siswa
    function cariNilai() {
        const inputRaw = document.getElementById('nisnInput').value;
        const nisnSearch = formatNISN(inputRaw);
        const errorMsg = document.getElementById('errorMsg');
        const resultCard = document.getElementById('resultCard');
        const scoresGrid = document.getElementById('scoresGrid');
        const rankCardContainer = document.getElementById('rankCardContainer');

        if (!inputRaw.trim()) {
            errorMsg.innerText = "Harap masukkan NISN terlebih dahulu!";
            errorMsg.style.display = 'block';
            resultCard.style.display = 'none';
            return;
        }

        const siswa = dataSiswaActive.find(s => {
            const nisnDataRaw = String(s.NISN || s.nisn || "").trim();
            const nisnDataFormatted = formatNISN(nisnDataRaw);
            return nisnDataRaw === inputRaw.trim() || nisnDataFormatted === nisnSearch;
        });

        if (siswa) {
            errorMsg.style.display = 'none';
            
            document.getElementById('resNama').innerText = siswa['NAMA SISWA'] || siswa['nama'] || siswa['Nama'] || '-';
            document.getElementById('resNisn').innerText = siswa['NISN'] || siswa['nisn'] || inputRaw;

            scoresGrid.innerHTML = '';

            const ignoreKeys = ['NISN', 'NIS', 'NO', 'NAMA SISWA', 'NAMA', 'JK', 'PERINGKAT', 'RANK', 'JUMLAH', 'TOTAL', 'RATA-RATA'];

            Object.keys(siswa).forEach(key => {
                const upperKey = key.trim().toUpperCase();
                if (!ignoreKeys.includes(upperKey)) {
                    const scoreItem = document.createElement('div');
                    scoreItem.className = 'score-item';
                    scoreItem.innerHTML = `<span>${key}</span><strong>${siswa[key] !== undefined ? siswa[key] : '-'}</strong>`;
                    scoresGrid.appendChild(scoreItem);
                }
            });

            const peringkatKey = Object.keys(siswa).find(k => k.trim().toUpperCase() === 'PERINGKAT' || k.trim().toUpperCase() === 'RANK');
            if (peringkatKey && siswa[peringkatKey]) {
                document.getElementById('resPeringkat').innerText = siswa[peringkatKey];
                rankCardContainer.style.display = 'block';
            } else {
                rankCardContainer.style.display = 'none';
            }

            resultCard.style.display = 'block';
        } else {
            errorMsg.innerText = "NISN '" + inputRaw + "' tidak ditemukan. Periksa kembali nomor yang Anda masukkan!";
            errorMsg.style.display = 'block';
            resultCard.style.display = 'none';
        }
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') cariNilai();
    }

    // --- MANAJEMEN AUTHENTICATION & PASSWORD GURU ---
    let authMode = 'LOGIN'; // 'SETUP', 'LOGIN', 'RESET'

    function handleAdminAccess() {
        const savedPass = localStorage.getItem('adminPassword');
        document.getElementById('authError').style.display = 'none';

        if (!savedPass) {
            authMode = 'SETUP';
            document.getElementById('authTitle').innerHTML = `<i class="fa-solid fa-key" style="color:#0284c7;"></i> Buat Password Guru`;
            document.getElementById('authDesc').innerText = "Silakan buat password baru untuk mengamankan akses Panel Guru.";
            document.getElementById('groupNewPass').style.display = 'block';
            document.getElementById('groupConfirmPass').style.display = 'block';
            document.getElementById('groupLoginPass').style.display = 'none';
            document.getElementById('inputNewPass').value = '';
            document.getElementById('inputConfirmPass').value = '';
        } else {
            authMode = 'LOGIN';
            document.getElementById('authTitle').innerHTML = `<i class="fa-solid fa-lock" style="color:#0284c7;"></i> Masukkan Password Guru`;
            document.getElementById('authDesc').innerText = "Panel ini terkunci. Masukkan password yang telah Anda buat sebelumnya.";
            document.getElementById('groupNewPass').style.display = 'none';
            document.getElementById('groupConfirmPass').style.display = 'none';
            document.getElementById('groupLoginPass').style.display = 'block';
            document.getElementById('inputLoginPass').value = '';
        }

        document.getElementById('authModal').style.display = 'flex';
    }

    function submitAuth() {
        const authError = document.getElementById('authError');
        authError.style.display = 'none';

        if (authMode === 'SETUP' || authMode === 'RESET') {
            const newP = document.getElementById('inputNewPass').value.trim();
            const confP = document.getElementById('inputConfirmPass').value.trim();

            if (!newP) {
                authError.innerText = "Password tidak boleh kosong!";
                authError.style.display = 'block';
                return;
            }
            if (newP !== confP) {
                authError.innerText = "Konfirmasi password tidak cocok!";
                authError.style.display = 'block';
                return;
            }

            localStorage.setItem('adminPassword', newP);
            alert("Password berhasil disimpan!");
            closeAuthModal();
            openAdminModal();
        } else if (authMode === 'LOGIN') {
            const inputP = document.getElementById('inputLoginPass').value.trim();
            const savedP = localStorage.getItem('adminPassword');

            if (inputP === savedP) {
                closeAuthModal();
                openAdminModal();
            } else {
                authError.innerText = "Password salah. Silakan coba lagi!";
                authError.style.display = 'block';
            }
        }
    }

    function resetPasswordModal() {
        closeAdminModal();
        authMode = 'RESET';
        document.getElementById('authTitle').innerHTML = `<i class="fa-solid fa-key" style="color:#0284c7;"></i> Ganti Password Guru`;
        document.getElementById('authDesc').innerText = "Masukkan password baru untuk memperbarui kata sandi Anda.";
        document.getElementById('groupNewPass').style.display = 'block';
        document.getElementById('groupConfirmPass').style.display = 'block';
        document.getElementById('groupLoginPass').style.display = 'none';
        document.getElementById('inputNewPass').value = '';
        document.getElementById('inputConfirmPass').value = '';
        document.getElementById('authError').style.display = 'none';
        document.getElementById('authModal').style.display = 'flex';
    }

    function handleAuthKeyPress(e) {
        if (e.key === 'Enter') submitAuth();
    }

    function closeAuthModal() {
        document.getElementById('authModal').style.display = 'none';
    }

    // --- PANEL GURU SETTINGS ---
    function openAdminModal() {
        document.getElementById('inputSchoolName').value = document.getElementById('displaySchoolName').innerText;
        document.getElementById('inputPortalTitle').value = document.getElementById('displayPortalTitle').innerText;
        document.getElementById('adminModal').style.display = 'flex';
    }

    function closeAdminModal() {
        document.getElementById('adminModal').style.display = 'none';
    }

    function saveAdminSettings() {
        const schoolName = document.getElementById('inputSchoolName').value.trim();
        const portalTitle = document.getElementById('inputPortalTitle').value.trim();
        const logoFile = document.getElementById('inputLogoFile').files[0];
        const excelFile = document.getElementById('inputExcelFile').files[0];

        if (schoolName) {
            localStorage.setItem('schoolName', schoolName);
            document.getElementById('displaySchoolName').innerText = schoolName;
        }

        if (portalTitle) {
            localStorage.setItem('portalTitle', portalTitle);
            document.getElementById('displayPortalTitle').innerText = portalTitle;
        }

        // Proses Penyimpanan Logo
        if (logoFile) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Img = e.target.result;
                localStorage.setItem('schoolLogo', base64Img);
                renderLogo(base64Img);
            };
            reader.readAsDataURL(logoFile);
        }

        // Proses Penyimpanan File Excel Data Siswa
        if (excelFile) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array', raw: false});
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                const jsonData = XLSX.utils.sheet_to_json(worksheet, {raw: false});
                
                if (jsonData.length > 0) {
                    dataSiswaActive = jsonData;
                    localStorage.setItem('excelDataSiswa', JSON.stringify(jsonData));
                    alert("Berhasil mengimpor " + jsonData.length + " data siswa dari Excel!");
                }
                closeAdminModal();
            };
            reader.readAsArrayBuffer(excelFile);
        } else {
            closeAdminModal();
        }
    }
</script>
